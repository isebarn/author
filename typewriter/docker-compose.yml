services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookwriter
    ports:
      - "5555:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3050:3050"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bookwriter
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PORT: "3050"
      NITRO_PORT: "3050"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
